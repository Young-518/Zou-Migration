<section class="scene scene-heat" id="sceneHeat" data-scene="heat">
 <div class="scene-sticky">
 <div class="map-row row-heat">
 <div class="panel-col">
 <div class="heat-steps" id="heatSteps">
 <button class="heat-step on" type="button" data-period="1">
 <em>壹 · 先秦</em><b>源于齐鲁</b>
 <span>邹城、邹平、商丘三源并立，分布只在山东与豫东。</span>
 </button>
 <button class="heat-step" type="button" data-period="4">
 <em>贰 · 隋唐</em><b>渡江入赣</b>
 <span>范阳南迁、光州中转，宜黄开基——江西首次成为聚居核心。</span>
 </button>
 <button class="heat-step" type="button" data-period="8">
 <em>叁 · 当代</em><b>赣鄂湘为核心</b>
 <span>三省约占全国邹姓 38%，江西为第一大省（约 14%）。</span>
 </button>
 </div>
 <div class="panel">
 <h3>时期控制（作用于序图）</h3>
 <div class="timeline" data-vue-island="heat-timeline"></div>
 <div class="stage-now" id="heatNow"></div>
 <p class="stage-desc" id="heatDesc"></p>
 <div class="metric heat-legend">
 <b>热度图例</b>
 <span class="lg-item"><span class="lg-chip" style="background:#a55f2b"></span>核心聚集</span>
 <span class="lg-item"><span class="lg-chip" style="background:#cf9d62"></span>聚居发展</span>
 <span class="lg-item"><span class="lg-chip" style="background:#e8cfa8"></span>初步分布</span>
 <span class="lg-item"><span class="lg-chip" style="background:#f5efdf;border:1px solid var(--line)"></span>暂无记载</span>
 </div>
 <p class="chart-note" style="margin-top:8px">支系开关见下方「姓源五支」过渡栏（勾选后本图实时重新着色）。</p>
 </div>
 </div>
 <div class="map-card card-heat">
 <div class="card-title"><span class="tag" style="background:var(--accent2)">序</span>邹氏全国分布热区（时空动图）</div>
 <div class="map" id="mapHeat" role="region" aria-label="序章地图：邹氏全国分布热区动图" aria-describedby="mapHeat-desc"></div>
 <p class="vh" id="mapHeat-desc">热区动图：以省份为面，显示邹氏人口重心自先秦至当代的八期变化，重心由山东、河南逐步南移至赣鄂湘。</p>
 <div class="map-caption">底图区划 © DataV.GeoAtlas · 热度分级为依据调查报告整理的定性示意（非人口普查数值）</div>
 </div>
 </div>
 </div>
 </section>
