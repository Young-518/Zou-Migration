<section class="scene scene-pin" id="sceneMacro" data-scene="macro">
 <div class="scene-sticky">
 <div class="map-row row-macro" id="secMacro">
 <div class="panel-col">
 <div class="macro-steps" id="macroSteps">
 <div class="macro-step" data-stage="1">
 <h4><em>壹</em>源起齐鲁</h4>
 <p>曹姓邾国、子姓宋国两支并立，邹城、商丘是谱系起点（先秦）。</p>
 </div>
 <div class="macro-step" data-stage="2">
 <h4><em>贰</em>北出范阳</h4>
 <p>秦汉之际一支北迁涿州，形成「范阳邹氏」郡望，成为后世总堂号。</p>
 </div>
 <div class="macro-step" data-stage="4">
 <h4><em>叁</em>永嘉南渡</h4>
 <p>魏晋至隋唐，范阳一脉渡江入赣，光州、宜黄相继开基。</p>
 </div>
 <div class="macro-step" data-stage="7">
 <h4><em>肆</em>落籍双洲</h4>
 <p>明清「江西填湖广」「湖广填四川」，本支定格清江双洲（1507）。</p>
 </div>
 </div>
 </div>
 <div class="map-card card-macro">
 <div class="card-title"><span class="tag" style="background:var(--accent)">①</span>
 全国宏观 · 八阶段千年播迁
 <span class="card-sub">时间轴筛选 · 本支链叠加</span></div>
 <div id="mapMacro" class="map" role="region" aria-label="一号地图：全国宏观八阶段迁徙"></div>
 <div class="map-hud" id="macroHud">
 <div class="hud-line">
 <div class="mode-seg" role="group" aria-label="地图显示模式">
 <button id="btnAll" type="button" class="on" aria-pressed="true"
                  title="全景：33 段路线全部铺底，当前阶段高亮">全景（33 段）</button>
 <button id="btnSolo" type="button" aria-pressed="false"
                  title="只看本阶段：只显示当前阶段的路线">只看本阶段</button>
 <button id="btnPlay" type="button" title="播放八阶段迁徙" aria-label="播放八阶段迁徙路线">▶ 播放</button>
 </div>
 <div class="metric" id="histStatus"></div>
 </div>
 <div class="timeline">
 <input type="range" id="stageRange" min="1" max="8" step="1" value="8"
                 aria-label="迁徙阶段时间轴（左右方向键切换阶段）">
 <div class="stage-now" id="stageNow"></div>
 </div>
 <p class="stage-desc" id="stageDesc"></p>
 </div>
 <div class="map-caption">底图 © 高德地图 · 历史疆域据「江山时序」(谭其骧图集/CHGIS 简化示意) · 迁徙路线与节点为依据调查报告整理的示意表达</div>
 </div>
 </div>
 </div>
</section>
