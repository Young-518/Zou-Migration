 <p class="il-lead dropcap">邹姓发源于齐鲁，两千余年间由北向南长线播迁，最终形成以赣、鄂、湘为中心、江西为第一大省的格局。这一章先把「人从哪里来」说清楚：八期热区、五支源流、一句结论。</p>
 <div class="il-grid">
 <section class="il-q"><h3>谁在迁</h3><p>曹姓邾国与子姓宋国是两大主脉，另有姚姓、姒姓等支流；后世绝大多数归入范阳堂总堂号之下。</p></section>
 <section class="il-q"><h3>往哪迁</h3><p>秦汉北出范阳，永嘉南渡入赣，明清填湖广、填四川，一支渡海入台——方向一遍遍重复，落点逐次南移。</p></section>
 <section class="il-q"><h3>凭什么说</h3><p>33 段路线逐条出自调查报告表 2 与正文叙述，起点去重后 24 处；热区等级是定性示意，不是普查数值。</p></section>
 <section class="il-q"><h3>怎么读</h3><p>先看这一章的八期热区，再进 02 的四种看法，最后落到 03 的全国路线与 04 的七个站。</p></section>
