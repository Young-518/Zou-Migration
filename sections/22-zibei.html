 <h3>字辈诗 · 世代对照（十八世 → 三十九世）</h3>
 <div class="zibei-bar" id="zibeiBar"></div>
 <p class="zibei-info" id="zibeiInfo">字辈诗「宗仁仝才应 / 益名汝禧镇 / 德绍瑞尚占 / 茂亮生嘉永 / 和焕」共 22 字，逐字对应十八至三十九世：首字「宗」即十八世有宗公，末字「焕」止于三十九世。三处可与谱注互校——<b>22 世「应」</b>（应明、应朋、应元三大支）、<b>26 世「禧」</b>（禧字辈 16 支，禧时 344 人、禧明 178 人、禧选 103 人）、末字「焕」止于 <b>39 世（谱注载 5 人）</b>，世代跨度与族谱统计完全吻合。点击任一字辈，上方 ③ 号窗世系树将高亮该世代人物。</p>
